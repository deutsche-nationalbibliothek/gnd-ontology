title: GND Ontology
baseurl: "/standards/elementset"
url: "https://github.com" 

# Build settings
theme: jekyll-theme-jod
plugins:
  - liquid-md5

exclude: ["Gemfile", "Gemfile.lock", "gnd.ttl", "Taskfile.yaml", "README.md", "CONTRIBUTING.de.md", "CONTRIBUTING.md", "LICENSE"]

jekyll_rdf:
    path: "source/gnd.ttl"
    include_blank: true
    restriction: "SELECT ?resourceUri WHERE { ?resourceUri ?p ?o . FILTER regex(str(?resourceUri), \"^https://d-nb.info/standards/elementset/gnd\") }"
    #class_template_mappings:
    #  "http://www.w3.org/2002/07/owl#Ontology": "ontology"
    #instance_template_mappings :
    #  "https://d-nb.info/standards/elementset/gnd" : 'ontology.html'
